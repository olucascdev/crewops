name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  foundation:
    name: Foundation (install/lint/typecheck/test/build/openspec)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:17-3.4
        env:
          POSTGRES_DB: crewops
          POSTGRES_USER: crewops
          POSTGRES_PASSWORD: crewops
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U crewops -d crewops"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      NODE_ENV: development
      DATABASE_URL: postgres://crewops:crewops@localhost:5432/crewops
      REDIS_URL: redis://localhost:6379
      TEST_DATABASE_URL: postgres://crewops:crewops@localhost:5432/crewops_test
      TEST_REDIS_URL: redis://localhost:6379/1
      NEXT_PUBLIC_API_URL: http://localhost:4000
      NEXT_PUBLIC_WS_URL: http://localhost:4000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install (locked)
        run: npm ci
      - name: OpenSpec validation
        run: npm run openspec:validate
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm run test:unit
      - name: Integration tests
        run: npm run test:integration
      - name: Migrations applied and up to date
        run: npm run db:migrate && npm run db:migrate:check
      - name: Build
        run: npm run build

  e2e:
    name: PWA smoke E2E
    runs-on: ubuntu-latest
    needs: foundation
    env:
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: http://localhost:4000
      NEXT_PUBLIC_WS_URL: http://localhost:4000
      E2E_BASE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install (locked)
        run: npm ci
      - name: Build shared + web
        run: npm run build -w @crewops/shared && npm run build -w @crewops/web
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Run smoke E2E
        run: npm run test:e2e
