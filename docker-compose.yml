services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: crewops
      POSTGRES_USER: crewops
      POSTGRES_PASSWORD: crewops
    ports:
      - "5432:5432"
    volumes:
      - crewops-postgres:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - crewops-redis:/data

volumes:
  crewops-postgres:
  crewops-redis:
